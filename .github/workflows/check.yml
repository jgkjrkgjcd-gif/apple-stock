name: check
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python check.py
        env:
          PART: MK2D4J/A
          ZIP: "5440002"
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
